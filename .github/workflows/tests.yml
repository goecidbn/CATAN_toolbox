name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
    
jobs:

  core:
    name: Core (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install CATAN
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run headless tests
        run: python -m pytest -m "not gui"


  gui:
    name: GUI (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python:
          - "3.11"

    steps:

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Linux only
      - if: runner.os == 'Linux'
        name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 \
            libgl1 \
            libopengl0 \
            libx11-xcb1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xinput0
      
      - name: Install CATAN
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"

      - if: runner.os == 'Linux'
        name: Run GUI tests (Linux uses xvfb)
        run: |
          xvfb-run -a pytest -m gui
      
      - if: runner.os != 'Linux'
        name: Run GUI tests (non-Linux)
        run: |
          pytest -m gui

  build:
    name: Build and test distributions
    runs-on: ubuntu-latest
    
    needs:
      - core
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

  build-wheel:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build source distribution and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Create clean test environment
        run: python -m venv wheel-test-env

      - name: Install wheel in clean environment
        run: |
          python -c "
          import os
          import subprocess
          from pathlib import Path

          venv_python = (
              Path('wheel-test-env/Scripts/python.exe')
              if os.name == 'nt'
              else Path('wheel-test-env/bin/python')
          )

          wheels = list(Path('dist').glob('*.whl'))

          if len(wheels) != 1:
              raise RuntimeError(
                  f'Expected exactly one wheel, found {len(wheels)}: {wheels}'
              )

          subprocess.check_call([
              str(venv_python),
              '-m',
              'pip',
              'install',
              '--upgrade',
              'pip',
          ])

          subprocess.check_call([
              str(venv_python),
              '-m',
              'pip',
              'install',
              str(wheels[0]),
          ])
          "

      - name: Verify installed package
        run: |
          python -c "
          import os
          import subprocess
          from pathlib import Path

          venv_python = (
              Path('wheel-test-env/Scripts/python.exe')
              if os.name == 'nt'
              else Path('wheel-test-env/bin/python')
          )

          code = '''
          import catan

          assert hasattr(catan, \"__version__\")
          assert catan.__version__

          print(f\"Installed CATAN version: {catan.__version__}\")
          '''

          subprocess.check_call([
              str(venv_python),
              '-c',
              code,
          ])
          "

      - name: Verify entry-point metadata
        run: |
          python -c "
          import os
          import subprocess
          from pathlib import Path

          venv_python = (
              Path('wheel-test-env/Scripts/python.exe')
              if os.name == 'nt'
              else Path('wheel-test-env/bin/python')
          )

          code = '''
          from importlib.metadata import entry_points

          cli_matches = list(
              entry_points(group=\"console_scripts\", name=\"catan\")
          )
          gui_matches = list(
              entry_points(group=\"gui_scripts\", name=\"catan-gui\")
          )

          assert len(cli_matches) == 1, cli_matches
          assert len(gui_matches) == 1, gui_matches

          cli = cli_matches[0]
          gui = gui_matches[0]

          assert cli.value == \"catan.cli:main\"
          assert gui.value == \"catan.gui.app:main\"

          print(f\"CLI: {cli.name} -> {cli.value}\")
          print(f\"GUI: {gui.name} -> {gui.value}\")
          '''

          subprocess.check_call([
              str(venv_python),
              '-c',
              code,
          ])
          "

      - name: Verify CLI commands
        run: |
          python -c "
          import os
          import subprocess
          from pathlib import Path

          scripts_dir = (
              Path('wheel-test-env/Scripts')
              if os.name == 'nt'
              else Path('wheel-test-env/bin')
          )

          executable = (
              scripts_dir / 'catan.exe'
              if os.name == 'nt'
              else scripts_dir / 'catan'
          )

          if not executable.exists():
              raise FileNotFoundError(
                  f'CLI executable was not created: {executable}'
              )

          commands = [
              [str(executable), '--help'],
              [str(executable), '--version'],
              [str(executable), 'match', '--help'],
          ]

          for command in commands:
              print('Running:', ' '.join(command))
              subprocess.check_call(command)
          "

      - name: Verify GUI launcher exists
        run: |
          python -c "
          import os
          from pathlib import Path

          scripts_dir = (
              Path('wheel-test-env/Scripts')
              if os.name == 'nt'
              else Path('wheel-test-env/bin')
          )

          executable = (
              scripts_dir / 'catan-gui.exe'
              if os.name == 'nt'
              else scripts_dir / 'catan-gui'
          )

          if not executable.exists():
              raise FileNotFoundError(
                  f'GUI executable was not created: {executable}'
              )

          print(f'GUI executable: {executable}')
          "