name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  headless-tests:
    name: Headless · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CATAN
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run headless tests
        run: python -m pytest -m "not gui"


  gui-tests:
    name: GUI · Python 3.12
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            xvfb \
            libegl1 \
            libgl1 \
            libopengl0 \
            libx11-xcb1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xinput0

      - name: Install CATAN
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"

      - name: Run GUI tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1280x1024x24" \
            python -m pytest -m gui


  build-distributions:
    name: Build and test distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

      - name: Create wheel-test environment
        run: python -m venv wheel-test-env

      - name: Install built wheel
        run: |
          wheel-test-env/bin/python -m pip install --upgrade pip
          wheel="$(find dist -name '*.whl' -print -quit)"
          wheel-test-env/bin/python -m pip install "${wheel}[gui]"

      - name: Verify installed wheel
        run: |
            wheel-test-env/bin/python - <<'PY'
            from importlib.metadata import entry_points, version

            import catan

            assert catan.__version__ == version("catan")

            matches = list(
                entry_points(group="gui_scripts", name="catan")
            )

            assert len(matches) == 1
            assert matches[0].value == "catan.gui.app:main"

            print("Version:", catan.__version__)
            print("Location:", catan.__file__)
            print("Entry point:", matches[0])
            PY