gui-tests:
  name: GUI · Python 3.12
  runs-on: ubuntu-latest

  steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install Linux GUI dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --yes \
          xvfb \
          libegl1 \
          libgl1 \
          libxkbcommon-x11-0 \
          libxcb-cursor0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-render-util0 \
          libxcb-xinerama0

    - name: Install CATAN
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[gui,dev]"

    - name: Run GUI tests
      env:
        LIBGL_ALWAYS_SOFTWARE: "1"
      run: |
        xvfb-run \
          --auto-servernum \
          --server-args="-screen 0 1280x1024x24" \
          python -m pytest -s