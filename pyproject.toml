[build-system]
requires = ["setuptools>=77.0.3", "wheel", "setuptools_scm>=10"]
build-backend = "setuptools.build_meta"

[project]
name = "catan"
dynamic = ["version"]

description = "Interactive and algorithmic tools for matching and curating neurons across calcium imaging sessions"
readme = "README.md"

license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.11"

authors = [
    { name = "Alexander Schmidt" },
]

keywords = [
    "calcium imaging",
    "two-photon microscopy",
    "CaImAn",
    "neuroscience",
    "ROI tracking",
    "cell tracking",
    "longitudinal imaging",
    "microscopy",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",

    "Operating System :: POSIX :: Linux",

    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "opencv-python-headless>=4.13,<5",
    "tqdm",
    "matplotlib",
    "scikit-image",
]

[project.optional-dependencies]
gui = [
    "PySide6",
    "vispy",
    "qtawesome",
    "psutil",
    "pyqtdarktheme-fork>=2.3.6",
    "shiboken6",
]
dev = [
    "build",
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
    "nbstripout",
    "setuptools-scm>=10",
]

[project.scripts]
catan = "catan.cli:main"

[project.gui-scripts]
catan-gui = "catan.gui.app:main"

[project.urls]
Homepage = "https://github.com/woxxel/CATAN_toolbox"
Documentation = "https://github.com/woxxel/CATAN_toolbox/wiki"
Issues = "https://github.com/woxxel/CATAN_toolbox/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
markers = [
    "gui: tests requiring PySide6 or a graphical display",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["catan*"]

[tool.setuptools.package-data]
"catan.gui.resources" = [
    "styles/*.qss",
    "icons/*.svg",
    "icons/*.png",
    "images/*.png",
    "images/*.jpg",
    "defaults/*.json",
    "defaults/*.yaml",
    "defaults/*.toml",
]

[tool.setuptools_scm]
version_file = "src/catan/_version.py"